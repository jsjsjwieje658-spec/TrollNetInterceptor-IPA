name: Build AetherNet IPA

# =============================================================================
#  Replicates the local Linux cross-build pipeline exactly:
#    1. clang 19 + lld 19 (+ ld64.lld symlink for Mach-O linking)
#    2. iPhoneOS16.5.sdk from theos/sdks (sparse clone, no full checkout)
#    3. ldid (Procursus release binary)
#    4. scripts/crossbuild-linux.sh  →  AetherNet.tipa / .ipa
#    5. Mach-O symbol-table + signature verification (fails the build loudly)
# =============================================================================

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  AETHER_SDK: ${{ github.workspace }}/.deps/sdk-repo/iPhoneOS16.5.sdk
  AETHER_LDID: ${{ github.workspace }}/.deps/ldid

jobs:
  build:
    name: Cross-build AetherNet.tipa (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cross toolchain (clang 19 + lld 19)
        run: |
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          sudo install -d /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor | sudo tee "/etc/apt/keyrings/llvm.gpg" >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19 lld-19 git-lfs
          # Create unversioned wrappers for clang
          sudo ln -sf /usr/bin/clang-19    /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-19  /usr/local/bin/clang++
          # ld64.lld-19 is the Mach-O linker from LLVM LLD
          # clang -fuse-ld=lld on Mach-O targets searches PATH for an
          # UNVERSIONED 'ld64.lld' — clang rejects versioned names outright.
          if [ -f /usr/bin/ld64.lld-19 ]; then
            sudo ln -sf /usr/bin/ld64.lld-19 /usr/local/bin/ld64.lld
          fi
          command -v ld64.lld >/dev/null || { echo "::error::ld64.lld not resolvable"; exit 1; }
          ld64.lld -v 2>&1 | head -1 || true
          clang --version | head -1
          echo "ld64.lld-19 location: $(which ld64.lld-19 2>/dev/null || echo 'not found')"

      - name: Provision iPhoneOS16.5.sdk (theos/sdks sparse clone)
        run: |
          mkdir -p .deps
          cd .deps
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git sdk-repo
          cd sdk-repo
          git lfs install
          git lfs pull --include="iPhoneOS16.5.sdk/*"
          git sparse-checkout set iPhoneOS16.5.sdk
          # Ensure all files are materialized
          git lfs pull --include="iPhoneOS16.5.sdk/**" 2>/dev/null || true
          test -f iPhoneOS16.5.sdk/usr/include/unistd.h || {
            echo "::error::iPhoneOS16.5.sdk incomplete after sparse checkout"; exit 1; }
          echo "SDK ready: $(du -sh iPhoneOS16.5.sdk | cut -f1)"

      - name: Provision ldid (Procursus release)
        run: |
          curl -sL -o .deps/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x .deps/ldid
          .deps/ldid 2>&1 | head -1

      - name: Install Pillow (icon generation)
        run: |
          python3 -m pip install --break-system-packages --quiet Pillow \
            || python3 -m pip install --quiet Pillow
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Build (crossbuild-linux.sh)
        run: |
          chmod +x scripts/crossbuild-linux.sh
          bash scripts/crossbuild-linux.sh
          test -f AetherNet.tipa || { echo "::error::AetherNet.tipa not produced"; exit 1; }
          ls -la AetherNet.tipa build-linux/stage/Payload/AetherNet.app/

      - name: Verify Mach-O symbol tables (classes / shim / IOHID extern "C")
        run: |
          python3 - <<'PYEOF'
          import struct, sys

          def load_syms(path):
              with open(path, 'rb') as f:
                  d = f.read()
              ncmds = struct.unpack_from("<I", d, 16)[0]
              off = 32
              symoff = nsyms = stroff = 0
              for _ in range(ncmds):
                  cmd, cs = struct.unpack_from("<II", d, off)
                  if cmd == 0x2:  # LC_SYMTAB
                      symoff, nsyms, stroff = struct.unpack_from("<III", d, off + 8)
                      break
                  off += cs
              else:
                  print(f"::{ 'error' }::no LC_SYMTAB in {path}"); sys.exit(1)
              defined, undef = set(), []
              for i in range(nsyms):
                  o = symoff + i * 16
                  x, t, sct, ds, v = struct.unpack_from("<IBBHQ", d, o)
                  e = d.index(b'\0', stroff + x)
                  name = d[stroff + x:e].decode(errors='replace')
                  if (t & 0x0e) == 0:
                      undef.append(name)
                  else:
                      defined.add(name)
              return defined, undef

          failed = False
          for path in ["build-linux/stage/Payload/AetherNet.app/AetherNet",
                       "build-linux/stage/Payload/AetherNet.app/libNetHookPayload.dylib"]:
              defined, undef = load_syms(path)
              print(f"── {path.split('/')[-1]}")
              missing = [x for x in undef
                         if x.startswith("_OBJC_CLASS_$_")
                         and x[14:].startswith(("Aether", "HUD", "TS", "AX"))]
              print("   missing app classes:", missing or "NONE ✔")
              shim = "OK ✔" if any("PlatformVersionAtLeast" in x for x in defined) else "MISSING!"
              print("   compiler-rt shim:", shim)
              mangled = [x for x in undef if x.startswith("__Z") and "IOHID" in x]
              print("   C++-mangled IOHID undefs:", mangled or "none ✔")
              if missing or shim != "OK ✔" or mangled:
                  failed = True

          import plistlib
          info = plistlib.load(open("build-linux/stage/Payload/AetherNet.app/Info.plist", "rb"))
          ver, bld = info["CFBundleShortVersionString"], info["CFBundleVersion"]
          print(f"── version {ver} (build {bld})")
          if failed:
              print("::error::symbol verification FAILED"); sys.exit(1)
          print("── symbol verification PASSED ✔")
          PYEOF

      - name: Verify signature + entitlements
        run: |
          "$AETHER_LDID" -q build-linux/stage/Payload/AetherNet.app/AetherNet \
            && echo "signature VALID ✔" || { echo "::error::ldid -q FAILED"; exit 1; }
          ENT=$("$AETHER_LDID" -e build-linux/stage/Payload/AetherNet.app/AetherNet | head -4)
          test -n "$ENT" || { echo "::error::entitlements not embedded"; exit 1; }
          echo "$ENT"
          cp AetherNet.tipa AetherNet.ipa

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetherNet-IPA-${{ github.run_number }}
          path: |
            AetherNet.tipa
            AetherNet.ipa
          if-no-files-found: error

  release:
    name: Attach IPA to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: AetherNet-IPA-${{ github.run_number }}
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AetherNet.tipa
            dist/AetherNet.ipa
