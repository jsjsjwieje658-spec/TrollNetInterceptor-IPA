name: Build AetherNet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macOS:
    name: Build iOS IPA (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid
          pip3 install Pillow 2>/dev/null || true

      - name: Cross-build with clang
        id: build
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          if [ -z "$SDK_PATH" ]; then
            echo "iPhoneOS SDK not available — cannot cross-build"
            exit 1
          fi
          echo "Using SDK: $SDK_PATH"
          CLANG=$(xcrun --find clang 2>/dev/null || which clang)
          echo "Clang: $CLANG"
          TARGET="-target arm64-apple-ios14.0"
          MINOS="-mios-version-min=14.0"
          COMMON_FLAGS="$TARGET $MINOS -isysroot $SDK_PATH -I./headers -O2 -g0 -fmessage-length=0 -pipe -Wno-deprecated-declarations -Wno-unused-variable -Wno-unused-parameter -Wno-unused-function -Wno-objc-designated-initializers -Wno-nullability-completeness -Wno-incomplete-umbrella"
          MMFLAGS="$COMMON_FLAGS -x objective-c++ -std=gnu++17 -fobjc-arc -fobjc-weak"
          CFLAGS="$COMMON_FLAGS -x c -std=gnu11"
          mkdir -p build-mac

          echo "── [1/4] Compiling libNetHookPayload.dylib (arm64)…"
          $CLANG $MMFLAGS -c Payload/NetHookPayload.mm -o build-mac/NetHookPayload.o 2>&1 || { echo "NetHookPayload.mm FAIL"; exit 1; }
          $CLANG $CFLAGS   -c Payload/fishhook.c       -o build-mac/fishhook.o       2>&1 || { echo "fishhook.c FAIL"; exit 1; }
          $CLANG $MMFLAGS -c Core/AetherSharedMemory.mm -o build-mac/AetherSharedMemory_dl.o 2>&1 || { echo "AetherSharedMemory(dl) FAIL"; exit 1; }
          $CLANG $CFLAGS   -c Core/compiler_rt_shim.c  -o build-mac/compiler_rt_shim_dl.o 2>&1 || { echo "compiler_rt_shim.c(dl) FAIL"; exit 1; }
          $CLANG $MMFLAGS -DAETHER_LOG_STANDALONE -c Core/AetherLog.mm -o build-mac/AetherLog_dl.o 2>&1 || { echo "AetherLog.mm(dl) FAIL"; exit 1; }

          echo "── Linking dylib…"
          $CLANG $TARGET $MINOS -isysroot $SDK_PATH \
            -dynamiclib -Wl,-undefined,dynamic_lookup \
            -framework Foundation -framework CoreFoundation -lobjc -lc++ \
            build-mac/NetHookPayload.o build-mac/fishhook.o build-mac/AetherSharedMemory_dl.o build-mac/compiler_rt_shim_dl.o build-mac/AetherLog_dl.o \
            -o build-mac/libNetHookPayload.dylib 2>&1 || { echo "DYLIB LINK FAIL"; exit 1; }

          echo "── [2/4] Compiling AetherNet executable (arm64)…"
          # main.mm uses #import of other .mm/.m files (single-binary pattern).
          # We compile main.mm as the sole translation unit. Note: -dead_strip is
          # NOT used here because it would strip classes like AetherFloatingToggleButton
          # that are only referenced indirectly via objc_getClass/NSInvocation in
          # the HUD plugin-mode bootstrap path.
          $CLANG $MMFLAGS -c main.mm -o build-mac/main.o 2>&1 || { echo "main.mm FAIL"; exit 1; }
          $CLANG $CFLAGS   -c Core/compiler_rt_shim.c  -o build-mac/compiler_rt_shim_app.o 2>&1 || { echo "compiler_rt_shim_app FAIL"; exit 1; }

          echo "── Linking executable…"
          $CLANG $TARGET $MINOS -isysroot $SDK_PATH \
            -Wl,-undefined,dynamic_lookup \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework CoreFoundation \
            -lobjc -lc++ \
            build-mac/main.o build-mac/compiler_rt_shim_app.o \
            -o build-mac/AetherNet 2>&1 || { echo "EXECUTABLE LINK FAIL"; exit 1; }

          echo "── [3/4] Binary build succeeded"
          file build-mac/AetherNet
          file build-mac/libNetHookPayload.dylib

      - name: Generate Info.plist
        run: |
          python3 scripts/gen_info_plist.py build-mac/Info.plist

      - name: Stage IPA bundle
        run: |
          STAGE="build-mac/stage"
          APP="$STAGE/Payload/AetherNet.app"
          rm -rf "$STAGE"
          mkdir -p "$APP"

          cp build-mac/AetherNet "$APP/AetherNet"
          cp build-mac/libNetHookPayload.dylib "$APP/libNetHookPayload.dylib"
          cp build-mac/Info.plist "$APP/Info.plist"
          chmod 755 "$APP/AetherNet"
          chmod 755 "$APP/libNetHookPayload.dylib"

          echo "── [4/4] Icon generation…"
          # Try Pillow resize from source PNG
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/gen_icons.py "$APP" supports/AppIconSource.png 2>/dev/null || \
            python3 scripts/gen_icons_placeholder.py "$APP" 2>/dev/null || \
            echo "Icon generation skipped — will add placeholder"
          fi

          # Fallback: use macOS sips
          if [ ! -f "$APP/AppIcon60x60@2x.png" ]; then
            sips -s format png -Z 240 supports/AppIconSource.png --out "$APP/AppIcon60x60@2x.png" 2>/dev/null || true
          fi
          if [ ! -f "$APP/AppIcon60x60@3x.png" ]; then
            sips -s format png -Z 360 supports/AppIconSource.png --out "$APP/AppIcon60x60@3x.png" 2>/dev/null || true
          fi

          ls -la "$APP/"

      - name: Fakesign with entitlements
        run: |
          APP="build-mac/stage/Payload/AetherNet.app"
          if command -v ldid >/dev/null 2>&1; then
            ldid -Ssupports/entitlements.plist "$APP/AetherNet"
            ldid -Ssupports/entitlements.plist "$APP/libNetHookPayload.dylib"
            echo "Entitlements embedded"
            ldid -e "$APP/AetherNet" | head -5
          else
            echo "ldid not installed — skipping fakesign"
            exit 1
          fi

      - name: Package as .tipa
        run: |
          cd build-mac/stage && rm -f "$GITHUB_WORKSPACE/AetherNet.tipa" && zip -qry "$GITHUB_WORKSPACE/AetherNet.tipa" Payload
          ls -la "$GITHUB_WORKSPACE/AetherNet.tipa"
          unzip -l "$GITHUB_WORKSPACE/AetherNet.tipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherNet-tipa
          path: AetherNet.tipa
          retention-days: 14
