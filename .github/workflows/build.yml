name: Build AetherNet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macOS:
    name: Build iOS Binary (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Cross-build with clang
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          if [ -z "$SDK_PATH" ]; then
            echo "iPhoneOS SDK not available — cannot cross-build"
            exit 1
          fi
          echo "Using SDK: $SDK_PATH"
          CLANG=$(xcrun --find clang 2>/dev/null || which clang)
          echo "Clang: $CLANG"
          TARGET="-target arm64-apple-ios14.0"
          MINOS="-mios-version-min=14.0"
          COMMON_FLAGS="$TARGET $MINOS -isysroot $SDK_PATH -I./headers -O2 -g0 -fmessage-length=0 -pipe -Wno-deprecated-declarations -Wno-unused-variable -Wno-unused-parameter -Werror=format -Wno-unused-function -Wno-objc-designated-initializers -Wno-nullability-completeness -Wno-incomplete-umbrella"
          MMFLAGS="$COMMON_FLAGS -x objective-c++ -std=gnu++17 -fobjc-arc -fobjc-weak"
          CFLAGS="$COMMON_FLAGS -x c -std=gnu11"
          mkdir -p build-mac

          # Compile dylib objects (standalone — not imported by main.mm)
          $CLANG $MMFLAGS -c Payload/NetHookPayload.mm -o build-mac/NetHookPayload.o 2>&1 || { echo "NetHookPayload.mm FAIL"; exit 1; }
          $CLANG $CFLAGS   -c Payload/fishhook.c       -o build-mac/fishhook.o       2>&1 || { echo "fishhook.c FAIL"; exit 1; }
          $CLANG $MMFLAGS -DAETHER_LOG_STANDALONE -c Core/AetherLog.mm -o build-mac/AetherLog_dl.o 2>&1 || { echo "AetherLog.mm(dl) FAIL"; exit 1; }
          $CLANG $CFLAGS   -c Core/compiler_rt_shim.c  -o build-mac/compiler_rt_shim_dl.o 2>&1 || { echo "compiler_rt_shim.c(dl) FAIL"; exit 1; }
          $CLANG $MMFLAGS -c Core/AetherSharedMemory.mm -o build-mac/AetherSharedMemory_dl.o 2>&1 || { echo "AetherSharedMemory(dl) FAIL"; exit 1; }

          # Link dylib
          $CLANG $TARGET $MINOS -isysroot $SDK_PATH \
            -dynamiclib -Wl,-undefined,dynamic_lookup \
            -framework Foundation -framework CoreFoundation -lobjc -lc++ \
            build-mac/NetHookPayload.o build-mac/fishhook.o build-mac/AetherLog_dl.o build-mac/AetherSharedMemory_dl.o build-mac/compiler_rt_shim_dl.o \
            -o build-mac/libNetHookPayload.dylib 2>&1 || { echo "DYLIB LINK FAIL"; exit 1; }

          # Compile executable — main.mm imports HUD/HUDMain.mm and UI/MainApp.mm
          # directly (single-binary pattern), so we only compile main.mm to avoid
          # duplicate symbols from the included .mm/.m files.
          $CLANG $MMFLAGS -c main.mm -o build-mac/AetherNet.o 2>&1 || { echo "main.mm FAIL"; exit 1; }

          # compiler_rt_shim (for app executable)
          $CLANG $CFLAGS -c Core/compiler_rt_shim.c -o build-mac/compiler_rt_shim_app.o 2>&1 || { echo "compiler_rt_shim_app FAIL"; exit 1; }

          # Link executable
          $CLANG $TARGET $MINOS -isysroot $SDK_PATH \
            -Wl,-undefined,dynamic_lookup -Wl,-dead_strip \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -lobjc -lc++ \
            build-mac/AetherNet.o build-mac/compiler_rt_shim_app.o \
            -o build-mac/AetherNet 2>&1 || { echo "EXECUTABLE LINK FAIL"; exit 1; }

          echo "Binary build succeeded"
          file build-mac/AetherNet
          file build-mac/libNetHookPayload.dylib

      - name: Fakesign with entitlements
        run: |
          if command -v ldid >/dev/null 2>&1 && [ -f build-mac/AetherNet ]; then
            ldid -Ssupports/entitlements.plist build-mac/AetherNet
            ldid -Ssupports/entitlements.plist build-mac/libNetHookPayload.dylib
            echo "Entitlements embedded"
            ldid -e build-mac/AetherNet | head -5
          fi
